<form class="task-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <label class="form-label" for="task-title">Nombre de la tarea</label>
    <input class="form-input" id="task-title" formControlName="title" placeholder="Escribe el nombre de la tarea..." autocomplete="off" [attr.aria-invalid]="form.controls.title.invalid && form.controls.title.touched" />
    @if (form.controls.title.touched && form.controls.title.hasError('required')) {
      <small class="form-error">Ingresa un nombre para la tarea.</small>
    } @else if (form.controls.title.touched && form.controls.title.hasError('whitespace')) {
      <small class="form-error">El nombre no puede contener solo espacios.</small>
    }
  </div>

  <div class="form-options">
    <div class="form-field">
      <label class="form-label" for="task-category">Categoría</label>
      <p-select inputId="task-category" [options]="categories" formControlName="category" aria-label="Categoría de la tarea" appendTo="body" panelStyleClass="task-select-panel" styleClass="task-select" />
    </div>
    <div class="form-field">
      <label class="form-label" for="task-priority">Prioridad</label>
      <p-select inputId="task-priority" [options]="priorities" formControlName="priority" aria-label="Prioridad de la tarea" appendTo="body" panelStyleClass="task-select-panel" styleClass="task-select" />
    </div>
    <div class="form-field">
      <label class="form-label" for="task-date-limit">Fecha límite</label>
      <p-datepicker inputId="task-date-limit" formControlName="dateLimit" dateFormat="dd/mm/yy" [showIcon]="true" placeholder="Selecciona una fecha" appendTo="body" styleClass="task-date-picker" />
    </div>
  </div>

  <button class="form-submit" type="submit" [disabled]="form.invalid">＋ Crear tarea</button>
</form>
