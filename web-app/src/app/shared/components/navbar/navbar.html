<nav class="sidebar-navigation" aria-label="Navegación principal">
  @for (item of items; track item.label) {
    @if (item.enabled && item.route) {
      <a class="nav-item" [class.active]="item.active" [routerLink]="item.route">
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    } @else {
      <button class="nav-item nav-item-disabled" type="button" aria-disabled="true" [attr.title]="item.label + ': En construcción'" [attr.data-tooltip]="item.label + ': En construcción'" (click)="showUnavailable(item.label)">
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </button>
    }
  }
</nav>
